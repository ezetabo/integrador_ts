<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Login</title>
    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
    <div class="auth-form">
        <h1>Food Store</h1>
        <h2>Iniciar sesión</h2>

        <form id="form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="tucorreo@ejemplo.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>

            <button type="submit">Ingresar</button>

            <p id="mensaje"></p>
        </form>

        <p>¿No tenés cuenta? <a href="../registro/registro.html">Registrate</a></p>
    </div>

    <script type="module" src="./login.ts"></script>
</body>

</html>
